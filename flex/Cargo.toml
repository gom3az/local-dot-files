[package]
name = "flex"
version = "1.0.0"
edition = "2021"
description = "Reusable Rust TUI menu library (power/launch/clip/center/shot/theme/wallpaper/wifi)"
license = "MIT OR Apache-2.0"
authors = ["flex contributors"]
repository = "https://example.invalid/flex"
keywords = ["tui", "menu", "launcher", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "=0.29.0", features = ["crossterm"] }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Non-CJK widths: ambiguous codepoints are narrow (default-features off drops
# the `cjk` feature that would make them wide). See `src/width.rs`.
unicode-width = { version = "0.2", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1"

[[bench]]
name = "rerank"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
lto = true
strip = true
panic = "abort"
