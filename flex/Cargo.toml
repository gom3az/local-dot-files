# flex — workspace root.
#
# The engine now lives in its own repository,
# https://github.com/gom3az/flex-core, and is consumed here as a git dependency.
# What remains in this repo is the rice-specific half:
#
#   flex-rice   the eight providers that adapt hyprpaper/cliphist/nmcli/wpctl/…
#               to the engine, the `flex` binary, and the shell wrappers that
#               Hyprland and Waybar call. Machine-specific by nature.
#
# The workspace root is kept even with a single member, deliberately: it is what
# pins `target/` at `flex/target/`, which `~/.local/bin/flex` resolves through
# and which the wrappers' tests rely on. Flattening `flex-rice/` into `flex/`
# would move `flex-rice/wrappers/` and break all 13 config references — see
# Docs/project_structure.md.

[workspace]
members = ["flex-rice"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["flex contributors"]
repository = "https://github.com/gom3az/local-dot-files"

[workspace.dependencies]
# The reusable engine: its own repo, pinned by tag. To move to a new engine
# release, bump the tag here and run `cargo update -p flex-core`.
flex-core = { git = "https://github.com/gom3az/flex-core", tag = "v1.0.0" }
ratatui = { version = "=0.29.0", features = ["crossterm"] }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

# Profiles are only honoured at the workspace root.
[profile.release]
lto = true
strip = true
panic = "abort"
